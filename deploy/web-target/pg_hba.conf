# Only the dedicated new cluster uses this file. TCP requires TLS + SCRAM.
local all postgres peer
local all all reject
hostnossl all all 127.0.0.1/32 reject
hostssl planplan_web planplan_web_app,planplan_web_owner 127.0.0.1/32 scram-sha-256
hostssl planplan_web_test planplan_web_test 127.0.0.1/32 scram-sha-256
# Disposable drill databases are created by the isolated test/restore role.
hostssl all planplan_web_test 127.0.0.1/32 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
