name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  web:
    name: web static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node scripts/ci/classify-web-tests.mjs --check

  api:
    name: api postgresql 15
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: planplan
          POSTGRES_PASSWORD: planplan_ci_local_only
          POSTGRES_DB: planplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planplan -d planplan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgres://planplan:planplan_ci_local_only@127.0.0.1:5432/planplan_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --dir server install --frozen-lockfile
      - run: pnpm --dir server run typecheck
      - run: pnpm --dir server run build
      - run: mkdir -p ci-artifacts
      - run: pnpm --dir server exec tsx scripts/ai-fingerprint.ts
      - run: pnpm --dir server exec vitest run --exclude "dist/**" --reporter=json --outputFile=../ci-artifacts/vitest.json
      - if: always()
        run: node scripts/ci/check-vitest-report.mjs ci-artifacts/vitest.json
      - if: always()
        run: node scripts/ci/assert-pg-schemas.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-vitest-report
          path: ci-artifacts/vitest.json
          retention-days: 7
          if-no-files-found: ignore

  web-protocol:
    name: web protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      PLANPLAN_CI_SUITE: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: pnpm --dir server install --frozen-lockfile
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/ci/classify-web-tests.mjs --check
      - run: npx playwright test --config=playwright.ci.config.ts
      - if: always()
        run: node scripts/ci/check-playwright-report.mjs protocol
      - if: always()
        run: node scripts/ci/cleanup-fixture.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-protocol-results
          path: ci-artifacts
          retention-days: 7
          if-no-files-found: ignore

  web-smoke:
    name: web smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      PLANPLAN_CI_SUITE: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: pnpm --dir server install --frozen-lockfile
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/ci/classify-web-tests.mjs --check
      - run: npx playwright test --config=playwright.ci.config.ts
      - if: always()
        run: node scripts/ci/check-playwright-report.mjs smoke
      - if: always()
        run: node scripts/ci/cleanup-fixture.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-results
          path: ci-artifacts
          retention-days: 7
          if-no-files-found: ignore
